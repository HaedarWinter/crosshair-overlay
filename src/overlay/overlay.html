<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Crosshair Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      overflow: hidden;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="crosshair-canvas"></canvas>
  <script src="../shared/draw-crosshair.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
